buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Use Multi_fabric's shared tools in standalone and integrated checkouts.
def sharedTools = [rootProject.file('gradletools.gradle'),
                   file('../Multi_fabric/gradletools.gradle'),
                   file('../gradletools.gradle')].find { it.isFile() }
if (sharedTools != null) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkSpace/26.3_fabric/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "rftoolsbase-fabric"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Jenkins revisions identify Maven artifacts, not the runtime mod version.
def modVersion = project.version.toString()
if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
access()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    mc()
    config()
    energy()
    jei()
    top()
    mcjtylib()
}

modpublisher(['the-one-probe'], ['mcjtylib', 'fabric-api', 'forge-config-api-port'], ['the-one-probe'], ['mcjtylib', 'fabric-api', 'forge-config-api-port'], [])

task apiJar(type: Jar) {
    archiveClassifier = "api"
    from(sourceSets.main.output) {
        include "mcjty/rftoolsbase/api/**"
    }
}

artifacts {
    archives apiJar
}


publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifact apiJar

        artifactId = base.archivesName.get()
        pom {
            name = 'RFToolsBase'
            description = 'Base mod for all McJty tech mods'
            scm {
                url = 'https://github.com/McJtyMods/RFToolsBase'
                connection = 'scm:git:git@github.com:McJtyMods/RFToolsBase.git'
                developerConnection = 'scm:git:git@github.com:McJtyMods/RFToolsBase.git'
            }
            issueManagement {
                system = 'github'
                url = 'https://github.com/McJtyMods/RFToolsBase/issues'
            }
            licenses {
                license {
                    name = 'MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'McJty'
                    name = 'McJty'
                    roles = ['developer']
                }
            }
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}

tasks.named('test') { useJUnitPlatform() }

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}

// Native integration checks run with all three Fabric ports and the Jenkins libraries.
if (providers.gradleProperty('fabricPortTests').isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'rftools_fabric_test'
        enableGameTests = false
    }
    dependencies {
        gametestImplementation project(':RFToolsPower')
        gametestImplementation project(':ModXNet')
    }
}
